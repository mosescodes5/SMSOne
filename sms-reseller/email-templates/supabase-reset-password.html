<!--
  Paste this into: Supabase Dashboard -> Authentication -> Email Templates -> Reset password
  Suggested subject line: Reset your SMSOne password
-->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1a1d23;">

  <div style="font-weight: 700; font-size: 18px; margin-bottom: 28px;">
    <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#2CE6A6;margin-right:8px;"></span>
    SMSOne
  </div>

  <h1 style="font-size: 20px; font-weight: 700; margin: 0 0 12px;">Reset your password</h1>

  <p style="font-size: 14px; line-height: 1.6; color: #4a4f57; margin: 0 0 24px;">
    We got a request to reset the password for <strong>{{ .Email }}</strong>. Click below to choose a new one.
  </p>

  <a href="{{ .ConfirmationURL }}"
     style="display: inline-block; background: #2CE6A6; color: #0B231C; font-weight: 700;
            font-size: 14px; padding: 12px 28px; border-radius: 10px; text-decoration: none;
            margin-bottom: 24px;">
    Reset password
  </a>

  <p style="font-size: 13px; line-height: 1.6; color: #8a8f98; margin: 0 0 8px;">
    Or paste this link into your browser:
  </p>
  <p style="font-size: 12px; word-break: break-all; background: #f5f6f8; padding: 10px 12px; border-radius: 8px; color: #4a4f57; margin: 0 0 28px;">
    {{ .ConfirmationURL }}
  </p>

  <p style="font-size: 12px; color: #8a8f98; margin: 0;">
    If you didn't request this, you can safely ignore this email — your password won't change.
  </p>
</div>
